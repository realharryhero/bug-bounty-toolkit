services:
  virtual-browser:
    build: .
    container_name: virtual-browser
    ports:
      - "6080:6080"  # noVNC web interface
      - "5901:5901"  # VNC port (optional)
    environment:
      - DISPLAY=:1
      - RESOLUTION=1920x1080
    volumes:
      - browser-data:/root
    restart: unless-stopped
    shm_size: '2gb'  # Increased shared memory for browser stability
    stdin_open: true
    tty: true

volumes:
  browser-data:
    driver: local
