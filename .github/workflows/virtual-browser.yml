name: Virtual Browser CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'supervisord.conf'
      - '.github/workflows/virtual-browser.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'supervisord.conf'
      - '.github/workflows/virtual-browser.yml'

jobs:
  validate-setup:
    runs-on: ubuntu-latest
    name: Validate Virtual Browser Setup
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run validation tests
      run: |
        chmod +x test-virtual-browser-setup.sh
        ./test-virtual-browser-setup.sh
    
    - name: Validate Docker Compose configuration
      run: |
        docker compose config --quiet
    
    - name: Check shell script syntax
      run: |
        bash -n start-virtual-browser.sh
        bash -n demo-virtual-browser.sh
        bash -n troubleshoot-virtual-browser.sh

  build-test:
    runs-on: ubuntu-latest
    name: Build and Test Container
    needs: validate-setup
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Build Docker image
      run: |
        docker compose build
    
    - name: Start virtual browser
      run: |
        docker compose up -d
        sleep 15  # Wait for services to start
    
    - name: Check container is running
      run: |
        docker ps | grep virtual-browser
    
    - name: Check noVNC is accessible
      run: |
        curl -f http://localhost:6080 || exit 1
    
    - name: Check logs for errors
      if: always()
      run: |
        docker compose logs
    
    - name: Stop container
      if: always()
      run: |
        docker compose down -v

  documentation:
    runs-on: ubuntu-latest
    name: Check Documentation
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check documentation files exist
      run: |
        test -f VIRTUAL_BROWSER.md
        test -f QUICKSTART.md
        test -f VIRTUAL_BROWSER_CONFIG.md
        test -f docs/VIRTUAL_BROWSER_INTEGRATION.md
    
    - name: Check documentation has content
      run: |
        test -s VIRTUAL_BROWSER.md
        test -s QUICKSTART.md
        test -s VIRTUAL_BROWSER_CONFIG.md
        test -s docs/VIRTUAL_BROWSER_INTEGRATION.md
    
    - name: Check README mentions virtual browser
      run: |
        grep -q "Virtual Browser" README.md
